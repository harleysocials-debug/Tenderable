// ── DIRECT MESSAGING ──────────────────────────────────────────────────────────
var G_msgs = [];
var G_activeConvo = null;

async function loadDirectMessages(){
  var r = await api('GET', '/direct-messages');
  if(r&&r.messages){ G_msgs=r.messages; updateMsgBadge(); }
}

function updateMsgBadge(){
  var u=G.user; if(!u) return;
  var unread=G_msgs.filter(function(m){return m.to_user_id===u.id&&!m.read_at;}).length;
  var badge=$('msg-badge');
  if(badge){ badge.textContent=unread; badge.classList.toggle('hidden',unread===0); }
}

function openMessages(){
  $('msg-overlay').classList.add('open');
  renderMsgSidebar();
  if(G_activeConvo) openConvo(G_activeConvo.id, G_activeConvo.name);
}
function closeMessages(){ $('msg-overlay').classList.remove('open'); }
function closeMsgIfBg(e){ if(e.target===$('msg-overlay')) closeMessages(); }

function renderMsgSidebar(){
  var u=G.user; if(!u) return;
  // Build conversation list from all messages
  var convos={};
  G_msgs.forEach(function(m){
    var otherId = m.from_user_id===u.id ? m.to_user_id : m.from_user_id;
    var otherName = m.from_user_id===u.id ? m.to_user_name : m.from_user_name;
    if(!convos[otherId]) convos[otherId]={id:otherId,name:otherName,messages:[],unread:0};
    convos[otherId].messages.push(m);
    if(m.to_user_id===u.id&&!m.read_at) convos[otherId].unread++;
  });
  var list=$('msg-user-list'); list.innerHTML='';
  Object.values(convos).sort(function(a,b){
    var aLast=a.messages[a.messages.length-1].created_at;
    var bLast=b.messages[b.messages.length-1].created_at;
    return new Date(bLast)-new Date(aLast);
  }).forEach(function(c){
    var last=c.messages[c.messages.length-1];
    var item=document.createElement('div');
    item.className='msg-user-item'+(G_activeConvo&&G_activeConvo.id===c.id?' active':'');
    item.innerHTML='<div class="msg-user-avatar">'+initials(c.name)+'</div>'+
      '<div style="flex:1;min-width:0;"><div class="msg-user-name">'+c.name+'</div>'+
      '<div class="msg-user-preview">'+(last.message||'')+'</div></div>'+
      (c.unread>0?'<div class="msg-unread-dot"></div>':'');
    item.onclick=function(){ openConvo(c.id,c.name); };
    list.appendChild(item);
  });
}

function openConvo(userId, userName){
  G_activeConvo={id:userId,name:userName};
  renderMsgSidebar();
  // Mark as read
  api('PUT','/direct-messages/read',{fromUserId:userId}).then(function(){
    G_msgs.forEach(function(m){ if(m.from_user_id===userId&&m.to_user_id===G.user.id) m.read_at=new Date().toISOString(); });
    updateMsgBadge();
  });
  renderConvo(userId, userName);
}

function renderConvo(userId, userName){
  var u=G.user;
  var thread=$('msg-thread'); thread.innerHTML='';
  var head=document.createElement('div'); head.className='msg-thread-head'; head.textContent=userName; thread.appendChild(head);
  var msgs=document.createElement('div'); msgs.className='msg-thread-messages'; thread.appendChild(msgs);
  var convoMsgs=G_msgs.filter(function(m){
    return (m.from_user_id===u.id&&m.to_user_id===userId)||(m.from_user_id===userId&&m.to_user_id===u.id);
  }).sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});
  if(!convoMsgs.length){
    msgs.innerHTML='<div style="text-align:center;color:var(--ink4);font-size:0.82rem;padding:2rem;">No messages yet. Say hello!</div>';
  } else {
    convoMsgs.forEach(function(m){
      var isMine=m.from_user_id===u.id;
      var wrap=document.createElement('div');
      wrap.className='msg-bubble-wrap '+(isMine?'mine':'theirs');
      var delBtn=isMine?'<button class="msg-del" data-id="'+m.id+'" onclick="deleteDM(this.dataset.id)">&#10005;</button>':'';
      wrap.innerHTML='<div class="msg-bubble">'+m.message+(isMine?' '+delBtn:'')+'</div>'+
        '<div class="msg-meta">'+new Date(m.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+
        (isMine&&m.read_at?' &bull; <span style="color:#10b981;">✓ Read</span>':'')+'</div>';
      msgs.appendChild(wrap);
    });
    msgs.scrollTop=msgs.scrollHeight;
  }
  // Compose box
  var compose=document.createElement('div'); compose.className='msg-compose';
  var inp=document.createElement('textarea'); inp.className='msg-compose-input'; inp.placeholder='Message '+userName+'...'; inp.rows=1;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDM(userId,userName,inp);} });
  var btn=document.createElement('button'); btn.className='msg-send-btn'; btn.textContent='Send';
  btn.onclick=function(){ sendDM(userId,userName,inp); };
  compose.appendChild(inp); compose.appendChild(btn); thread.appendChild(compose);
}

async function sendDM(toUserId, toUserName, inp){
  var msg=inp.value.trim(); if(!msg) return;
  inp.value='';
  var r=await api('POST','/direct-messages',{toUserId:toUserId,toUserName:toUserName,message:msg});
  if(r){
    G_msgs.push({id:r.id,from_user_id:G.user.id,from_user_name:G.user.name,to_user_id:toUserId,to_user_name:toUserName,message:msg,created_at:new Date().toISOString(),read_at:null});
    renderConvo(toUserId,toUserName);
    renderMsgSidebar();
  } else {
    toast('Message failed to send — please try again','error');
    inp.value=msg; // restore the message text
  }
}

async function deleteDM(msgId){
  var r=await api('DELETE','/direct-messages/'+msgId);
  if(r){
    G_msgs=G_msgs.filter(function(m){return m.id!==msgId;});
    if(G_activeConvo) renderConvo(G_activeConvo.id,G_activeConvo.name);
    renderMsgSidebar();
    updateMsgBadge();
  }
}

async function newMessage(){
  // Pick a user to message
  var r=await api('GET','/admin/users');
  if(!r||!r.users) return;
  var others=r.users.filter(function(u){return u.id!==G.user.id&&u.status==='approved';});
  if(!others.length){toast('No other users to message','error');return;}
  var names=others.map(function(u,i){return (i+1)+'. '+u.name;}).join('\n');
  var pick=prompt('Who do you want to message?\n\n'+names+'\n\nEnter the number:');
  if(!pick) return;
  var idx=parseInt(pick)-1;
  if(isNaN(idx)||idx<0||idx>=others.length) return;
  openConvo(others[idx].id, others[idx].name);
}
window.deleteDM=deleteDM;
window.newMessage=newMessage;

function renderLooks(pack){
  var wrap=document.getElementById('looks-wrap'); if(!wrap) return;
  // Remove old look cards (keep add-look-btn)
  Array.from(wrap.children).forEach(function(c){ if(c.classList.contains('look-card')) c.remove(); });
  var addBtn=wrap.querySelector('.add-look-btn');

  var looks=pack.looks||[];
  looks.forEach(function(look,li){
    var card=buildLookCard(pack, look, li);
    wrap.insertBefore(card, addBtn);
  });
  initLookDrag(pack);
}

function buildLookCard(pack, look, li){
  var card=document.createElement('div');
  card.className='look-card';
  card.dataset.lookid=look.id;

  // Header
  var hd=document.createElement('div');
  hd.className='look-header';
  hd.innerHTML=
    '<div class="look-num">'+(li+1)+'</div>'+
    '<div class="look-title">Look '+(li+1)+(look.name?' — '+look.name:'')+'</div>'+
    '<span class="look-item-count">'+( look.items?look.items.length:0)+' item'+(( look.items&&look.items.length!==1)?'s':'')+'</span>'+
    '<button class="look-del-btn" data-lookid="'+look.id+'" data-packid="'+pack.id+'" onclick="deleteLook(this.dataset.packid,this.dataset.lookid)">&#10005;</button>';
  card.appendChild(hd);

  // Items split into key pieces and styling pieces
  var body=document.createElement('div');
  body.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:0;';
  
  var keyCol=document.createElement('div');
  keyCol.style.cssText='padding:0.6rem 0.75rem;display:flex;flex-direction:column;gap:0.4rem;border-right:1px solid var(--line);min-width:0;';
  var keyHead=document.createElement('div');
  keyHead.style.cssText='font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink4);margin-bottom:0.25rem;';
  keyHead.textContent='Key Pieces';
  keyCol.appendChild(keyHead);

  var styleCol=document.createElement('div');
  styleCol.style.cssText='padding:0.6rem 0.75rem;display:flex;flex-direction:column;gap:0.4rem;background:#fffbeb;min-width:0;';
  var styleHead=document.createElement('div');
  styleHead.style.cssText='font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#b45309;margin-bottom:0.25rem;';
  styleHead.textContent='✦ Styling Pieces';
  styleCol.appendChild(styleHead);

  var keyItems=(look.items||[]).filter(function(i){return i.type!=='styling_piece';});
  var styleItems=(look.items||[]).filter(function(i){return i.type==='styling_piece';});

  // Track overall index for delete
  (look.items||[]).forEach(function(item,ii){
    var el=buildLookItemEl(pack, look, item, ii);
    if(item.type==='styling_piece') styleCol.appendChild(el);
    else keyCol.appendChild(el);
  });

  if(!keyItems.length){
    var emptyKey=document.createElement('div');
    emptyKey.style.cssText='font-size:0.75rem;color:var(--ink4);padding:0.5rem 0;';
    emptyKey.textContent='No key pieces yet';
    keyCol.appendChild(emptyKey);
  }
  if(!styleItems.length){
    var emptySty=document.createElement('div');
    emptySty.style.cssText='font-size:0.75rem;color:#b45309;opacity:0.5;padding:0.5rem 0;';
    emptySty.textContent='No styling pieces yet';
    styleCol.appendChild(emptySty);
  }

  body.appendChild(keyCol);
  body.appendChild(styleCol);
  card.appendChild(body);

  // Add row
  var addRow=document.createElement('div');
  addRow.className='look-add-row';
  addRow.innerHTML=
    '<button class="look-add-btn" data-packid="'+pack.id+'" data-lookid="'+look.id+'" onclick="openStylePicker(this.dataset.packid,this.dataset.lookid)">+ Add from Range Board</button>'+
    '<button class="look-add-btn" data-packid="'+pack.id+'" data-lookid="'+look.id+'" onclick="openStylePicker(this.dataset.packid,this.dataset.lookid,true)">+ Add Styling Piece</button>';
  card.appendChild(addRow);
  return card;
}

function buildLookItemEl(pack, look, item, ii){
  var el=document.createElement('div');
  el.className='look-item';
  var img='';
  if(item.image) img='<img class="look-item-img" src="'+item.image+'" style="width:56px;height:56px;object-fit:cover;border-radius:7px;flex-shrink:0;display:block;">';
  else img='<div class="look-item-img-ph">&#127912;</div>';

  var badges='';
  if(item.type==='range_style'||item.type==='styling_piece'){
    if(item.colour) badges+='<span class="look-badge">'+item.colour+'</span>';
    if(item.storeGrade) badges+='<span class="look-badge">Grade '+item.storeGrade+'</span>';
    if(item.seasonCode) badges+='<span class="look-badge">'+item.seasonCode+'</span>';
    if(item.intakeMonth) badges+='<span class="look-badge">'+item.intakeMonth+'</span>';
  }
  // styling_piece column position makes badge redundant

  var priceQty='';
  if(item.retailPrice) priceQty+='<span class="look-badge" style="color:#10b981;">£'+parseFloat(item.retailPrice).toFixed(2)+'</span>';
  if(item.qty) priceQty+='<span class="look-badge">'+parseInt(item.qty).toLocaleString()+' units</span>';

  var notesId='notes-'+pack.id+'-'+look.id+'-'+ii;
  el.innerHTML=img+
    '<div class="look-item-info">'+
    '<div class="look-item-name">'+( item.description||'Unnamed')+'</div>'+
    '<div class="look-item-sub">'+(item.devName||item.source||'')+'</div>'+
    '<div class="look-item-badges">'+badges+priceQty+'</div>'+
    '<textarea class="look-item-notes" id="'+notesId+'" placeholder="Styling notes for this piece..." rows="2">'+( item.stylingNotes||'')+'</textarea>'+
    '</div>'+
    '<div class="look-item-actions">'+
    '<button class="look-item-del" data-packid="'+pack.id+'" data-lookid="'+look.id+'" data-itemidx="'+ii+'" onclick="deletePackItem(this.dataset.packid,this.dataset.lookid,parseInt(this.dataset.itemidx))">&#10005;</button>'+
    '</div>';

  // Save notes on blur
  var ta=el.querySelector('textarea');
  ta.addEventListener('blur',function(){
    var p=G.packs.find(function(x){return x.id===pack.id;});
    if(!p) return;
    var l=(p.looks||[]).find(function(x){return x.id===look.id;});
    if(!l||!l.items) return;
    l.items[ii].stylingNotes=ta.value;
    api('PUT','/packs/'+pack.id,{looks:p.looks});
  });
  return el;
}

function initLookDrag(pack){
  var wrap=document.getElementById('looks-wrap'); if(!wrap) return;
  var cards=Array.from(wrap.querySelectorAll('.look-card'));
  var dragSrc=null;
  cards.forEach(function(card){
    var hd=card.querySelector('.look-header');
    hd.addEventListener('mousedown',function(){ card.setAttribute('draggable','true'); });
    card.addEventListener('dragstart',function(e){
      e.dataTransfer.effectAllowed='move';
      dragSrc=card;
      setTimeout(function(){card.classList.add('dragging-look');},0);
    });
    card.addEventListener('dragend',function(){
      card.classList.remove('dragging-look');
      card.removeAttribute('draggable');
      wrap.querySelectorAll('.look-card').forEach(function(c){c.classList.remove('drag-over-look');});
      // Save new order
      var newOrder=Array.from(wrap.querySelectorAll('.look-card')).map(function(c){return c.dataset.lookid;});
      var p=G.packs.find(function(x){return x.id===pack.id;});
      if(p){
        var sorted=newOrder.map(function(id){ return (p.looks||[]).find(function(l){return l.id===id;});}).filter(Boolean);
        p.looks=sorted;
        api('PUT','/packs/'+pack.id,{looks:p.looks});
        renderLooks(p);
      }
    });
    card.addEventListener('dragover',function(e){
      e.preventDefault();
      if(dragSrc&&dragSrc!==card) card.classList.add('drag-over-look');
    });
    card.addEventListener('dragleave',function(){ card.classList.remove('drag-over-look'); });
    card.addEventListener('drop',function(e){
      e.preventDefault();
      card.classList.remove('drag-over-look');
      if(dragSrc&&dragSrc!==card){
        var addBtn=wrap.querySelector('.add-look-btn');
        var cards2=Array.from(wrap.querySelectorAll('.look-card'));
        var fromIdx=cards2.indexOf(dragSrc);
        var toIdx=cards2.indexOf(card);
        if(fromIdx<toIdx) wrap.insertBefore(dragSrc,card.nextSibling);
        else wrap.insertBefore(dragSrc,card);
      }
    });
  });
}

// ── LOOK ACTIONS ──────────────────────────────────────────────────────────────
async function addLook(packId){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  if(!p.looks) p.looks=[];
  p.looks.push({id:'look-'+Date.now(),name:'',items:[]});
  await api('PUT','/packs/'+packId,{looks:p.looks});
  renderLooks(p);
  // Add button still in DOM, scroll to it
  var wrap=document.getElementById('looks-wrap');
  if(wrap) wrap.scrollTop=wrap.scrollHeight;
}

async function deleteLook(packId, lookId){
  if(!confirm('Remove this look?')) return;
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  p.looks=(p.looks||[]).filter(function(l){return l.id!==lookId;});
  await api('PUT','/packs/'+packId,{looks:p.looks});
  renderLooks(p);
}

async function deletePackItem(packId, lookId, itemIdx){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  var look=(p.looks||[]).find(function(l){return l.id===lookId;}); if(!look) return;
  look.items=look.items.filter(function(_,i){return i!==itemIdx;});
  await api('PUT','/packs/'+packId,{looks:p.looks});
  renderLooks(p);
}

async function addFreeTextItem(packId, lookId){
  var desc=prompt('Styling item description (e.g. Wide leg linen trousers):'); if(!desc) return;
  var source=prompt('Source (e.g. Zara, Props, Borrowed):');
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  var look=(p.looks||[]).find(function(l){return l.id===lookId;}); if(!look) return;
  if(!look.items) look.items=[];
  look.items.push({type:'free_text',description:desc.trim(),source:source||'',stylingNotes:''});
  await api('PUT','/packs/'+packId,{looks:p.looks});
  renderLooks(p);
}

// ── STYLE PICKER ──────────────────────────────────────────────────────────────
var _pickerPackId=null, _pickerLookId=null, _pickerSelected=[], _pickerIsStyling=false;

function openStylePicker(packId, lookId, isStyling){
  _pickerPackId=packId; _pickerLookId=lookId; _pickerSelected=[]; _pickerIsStyling=!!isStyling;
  document.getElementById('sp-title').textContent=isStyling?'Add Styling Pieces':'Add Styles to Look';
  renderStylePicker();
  document.getElementById('style-picker-overlay').classList.add('open');
}
function closeStylePicker(){
  document.getElementById('style-picker-overlay').classList.remove('open');
  _pickerSelected=[];
}

function renderStylePicker(){
  var q=(document.getElementById('sp-search')||{}).value||'';
  var grid=document.getElementById('sp-grid'); if(!grid) return;
  grid.innerHTML='';
  var allStyles=[];
  G.devs.forEach(function(dev){
    (dev.products||[]).filter(function(p){return p.description;}).forEach(function(p){
      allStyles.push(Object.assign({},p,{_dev:dev}));
    });
  });
  allStyles.filter(function(s){ return !q||s.description.toLowerCase().includes(q.toLowerCase())||( s.colour||'').toLowerCase().includes(q.toLowerCase()); })
  .forEach(function(s,i){
    var dev=s._dev;
    var imgSrc=s.image||((dev.files||[]).find(function(f){return f.isImage&&f.dataUrl;})||{}).dataUrl;
    var card=document.createElement('div');
    card.className='style-picker-card'+( _pickerSelected.indexOf(i)>=0?' selected':'');
    card.innerHTML=(imgSrc?'<div style="width:100%;height:140px;overflow:hidden;background:#f3f4f6;"><img src="'+imgSrc+'" style="width:100%;height:140px;object-fit:cover;display:block;"></div>':'<div style="width:100%;height:140px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:2rem;">&#127912;</div>')+
      '<div class="style-picker-card-info"><div class="style-picker-card-name">'+s.description+'</div><div class="style-picker-card-sub">'+(s.colour||'')+' &bull; '+(dev.brand||'')+'</div></div>';
    card.dataset.idx=i;
    card.onclick=function(){
      var idx=_pickerSelected.indexOf(i);
      if(idx>=0) _pickerSelected.splice(idx,1); else _pickerSelected.push(i);
      card.classList.toggle('selected',_pickerSelected.indexOf(i)>=0);
    };
    // Store style data on card
    card._style=s;
    grid._styles=grid._styles||[];
    grid._styles[i]=s;
    grid.appendChild(card);
  });
}

async function confirmStylePicker(){
  if(!_pickerSelected.length){closeStylePicker();return;}
  var grid=document.getElementById('sp-grid'); if(!grid) return;
  var p=G.packs.find(function(x){return x.id===_pickerPackId;}); if(!p) return;
  var look=(p.looks||[]).find(function(l){return l.id===_pickerLookId;}); if(!look) return;
  if(!look.items) look.items=[];
  var allStyles=[];
  G.devs.forEach(function(dev){
    (dev.products||[]).filter(function(p){return p.description;}).forEach(function(p){
      allStyles.push(Object.assign({},p,{_dev:dev}));
    });
  });
  _pickerSelected.forEach(function(i){
    var s=allStyles[i]; if(!s) return;
    look.items.push({
      type:_pickerIsStyling?'styling_piece':'range_style', devId:s._dev.id, devName:s._dev.description,
      description:s.description, colour:s.colour||'', storeGrade:s.storeGrade||'',
      seasonCode:s.seasonCode||s._dev.seasonCode||'', intakeMonth:s.intakeMonth||'',
      retailPrice:s.retailPrice||'', qty:s.qty||'', targetCost:s.targetCost||'',
      image:s.image||((s._dev.files||[]).find(function(f){return f.isImage&&f.dataUrl;})||{}).dataUrl||'',
      stylingNotes:''
    });
  });
  await api('PUT','/packs/'+_pickerPackId,{looks:p.looks});
  closeStylePicker();
  renderLooks(p);
}

    var sizeStr=a.size?formatBytes(a.size):'';
    attHtml+='<div class="pack-attach-item">'+thumb+
      '<span class="pack-attach-name">'+( a.name||a.url||'')+'</span>'+
      '<span class="pack-attach-size">'+sizeStr+'</span>'+
      '<button class="pack-attach-open" onclick="openAttachment(\''+pack.id+'\','+i+')">Open</button>'+
      '<button class="pack-attach-del" onclick="deleteAttachment(\''+pack.id+'\','+i+')" title="Remove">&#10005;</button>'+
      '</div>';
  });

  return '<div class="pack-notes-section">'+
    '<div class="pack-notes-label">Shoot Notes &amp; Attachments</div>'+
    '<textarea class="pack-notes-textarea" id="pack-notes-ta" placeholder="Shoot direction, mood, references..." rows="3" onblur="savePackNotes(\''+pack.id+'\',this.value)">'+( pack.notes||'')+'</textarea>'+
    '<div class="pack-attach-list" id="pack-att-list">'+attHtml+'</div>'+
    '<div class="pack-link-row">'+
    '<input class="pack-link-input" id="pack-link-inp" placeholder="Paste a link (YouTube, Drive, Dropbox...)" onkeydown="if(event.key===\'Enter\')addPackLink(\''+pack.id+'\')">'+
    '<button class="pack-link-btn" onclick="addPackLink(\''+pack.id+'\')">+ Add Link</button>'+
    '</div>'+
    '<div class="pack-attach-zone" id="pack-drop-zone" '+
    'ondragover="event.preventDefault();this.classList.add(\'drag\')" '+
    'ondragleave="this.classList.remove(\'drag\')" '+
    'ondrop="packDropFiles(event,\''+pack.id+'\')" '+
    'onclick="document.getElementById(\'pack-file-inp\').click()">'+
    '<p>&#128206; <strong>Drop files here</strong> or click to browse &bull; Images, PDFs, PowerPoints, Videos</p>'+
    '</div>'+
    '<input type="file" id="pack-file-inp" multiple accept="image/*,.pdf,.ppt,.pptx,.mp4,.mov,.avi,.wmv" style="display:none" onchange="packHandleFiles(event,\''+pack.id+'\')">'+
    '</div>';
}

function getAttachIcon(a){
  if(a.type==='link') return '&#128279;';
  if(!a.mimeType) return '&#128462;';
  if(a.mimeType.startsWith('image/')) return '&#128247;';
  if(a.mimeType==='application/pdf') return '&#128196;';
  if(a.mimeType.includes('powerpoint')||a.mimeType.includes('presentation')) return '&#128202;';
  if(a.mimeType.startsWith('video/')) return '&#127909;';
  return '&#128462;';
}

function formatBytes(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/(1024*1024)).toFixed(1)+'MB';
}

async function savePackNotes(packId, val){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  p.notes=val;
  await api('PUT','/packs/'+packId,{notes:val});
}

async function addPackLink(packId){
  var inp=document.getElementById('pack-link-inp'); if(!inp) return;
  var url=inp.value.trim(); if(!url) return;
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  inp.value='';
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  if(!p.attachments) p.attachments=[];
  p.attachments.push({type:'link',url:url,name:url,addedAt:new Date().toISOString()});
  await api('PUT','/packs/'+packId,{attachments:p.attachments});
  refreshPackNotes(packId);
  toast('Link added','success');
}

function packDropFiles(e,packId){ e.preventDefault(); document.getElementById('pack-drop-zone').classList.remove('drag'); packProcessFiles(e.dataTransfer.files,packId); }
function packHandleFiles(e,packId){ packProcessFiles(e.target.files,packId); }

function packProcessFiles(files,packId){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  if(!p.attachments) p.attachments=[];
  var toProcess=Array.from(files);
  var promises=toProcess.map(function(file){
    return new Promise(function(resolve){
      // Videos over 20MB — store as placeholder only (no base64)
      if(file.type.startsWith('video/')&&file.size>20*1024*1024){
        p.attachments.push({type:'file',name:file.name,mimeType:file.type,size:file.size,dataUrl:null,note:'File too large to preview — add a link instead'});
        resolve();
        return;
      }
      var r=new FileReader();
      r.onload=function(ev){
        p.attachments.push({type:'file',name:file.name,mimeType:file.type,size:file.size,dataUrl:ev.target.result,addedAt:new Date().toISOString()});
        resolve();
      };
      r.readAsDataURL(file);
    });
  });
  Promise.all(promises).then(function(){
    api('PUT','/packs/'+packId,{attachments:p.attachments});
    refreshPackNotes(packId);
    toast(toProcess.length+' file'+(toProcess.length!==1?'s':'')+' added','success');
  });
}

async function deleteAttachment(packId,idx){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  p.attachments=p.attachments.filter(function(_,i){return i!==idx;});
  await api('PUT','/packs/'+packId,{attachments:p.attachments});
  refreshPackNotes(packId);
}

function openAttachment(packId,idx){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  var a=(p.attachments||[])[idx]; if(!a) return;
  if(a.type==='link'||!a.dataUrl){ window.open(a.url||a.dataUrl,'_blank'); return; }
  var w=window.open('');
  if(a.mimeType&&a.mimeType.startsWith('image/')){
    w.document.write('<img src="'+a.dataUrl+'" style="max-width:100%;"><\/\script>');
  } else {
    // PDF, PPT, video — create object element
    w.document.write('<object data="'+a.dataUrl+'" type="'+a.mimeType+'" width="100%" height="100%" style="min-height:100vh;"><\/object>');
  }
}

function refreshPackNotes(packId){
  var p=G.packs.find(function(x){return x.id===packId;}); if(!p) return;
  var section=document.querySelector('.pack-notes-section'); if(!section) return;
  section.outerHTML=buildPackNotesSection(p);
}

window.savePackNotes=savePackNotes;
window.addPackLink=addPackLink;
window.packDropFiles=packDropFiles;
window.packHandleFiles=packHandleFiles;
window.deleteAttachment=deleteAttachment;
window.openAttachment=openAttachment;

async function deleteDev(devId){
  if(!confirm('Delete this development? This cannot be undone.')) return;
  await api('DELETE','/developments/'+devId);
  G.devs=G.devs.filter(function(d){return d.id!==devId;}); delete G.devComments[devId];
  closeDetail(); renderMainContent(); buildFilters();
  toast('Development deleted');
}

// ── SEND TO TENDER ────────────────────────────────────────────────────────────
async function sendDevToTender(devId){
  var d=G.devs.find(function(x){return x.id===devId;}); if(!d) return;
  var days=prompt('Bid deadline (days from now):','14'); if(!days) return;
  days=parseInt(days); if(isNaN(days)||days<1) return;
  var deadlineDate=new Date(Date.now()+days*24*60*60*1000);
  var body=Object.assign({},d,{deadlineDate:deadlineDate.toISOString(),isTender:true,status:'open'});
  delete body.id;
  var r=await api('POST','/tenders',body);
  if(r&&r.tender){ G.tenders.unshift(Object.assign({},r.tender,{deadlineDate:new Date(r.tender.deadlineDate)})); toast('Sent to tender','success'); }
  else toast('Failed to send to tender','error');
  closeDetail();
}

// ── TENDERS TAB ───────────────────────────────────────────────────────────────
function renderTenders(mc){
  var tenders=G.tenders; var u=G.user;
  if(tenders.length===0){mc.innerHTML='<div class="range-board"><div class="empty-state"><div class="empty-state-icon">&#128196;</div><h3>No tenders</h3><p>Send a development to tender to get started.</p></div></div>'; return;}
  var html='<div class="tenders-grid">';
  tenders.forEach(function(t){
    var img=(t.files||[]).find(function(f){return f.isImage&&f.dataUrl;});
    var bids=G.bids.filter(function(b){return b.tenderId===t.id;});
    var now=new Date(); var diff=new Date(t.deadlineDate)-now;
    var daysLeft=Math.ceil(diff/(1000*60*60*24));
    html+='<div style="background:white;border:1px solid var(--line);border-radius:16px;padding:1.25rem;cursor:pointer;" onclick="viewTenderDetail(\''+t.id+'\')">';
    html+='<div style="display:flex;gap:1rem;align-items:flex-start;">';
    if(img) html+='<img src="'+img.dataUrl+'" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;">';
    else html+='<div style="width:90px;height:90px;border-radius:10px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;">&#127912;</div>';
    html+='<div style="flex:1;"><div style="font-weight:700;font-size:0.95rem;margin-bottom:0.25rem;">'+t.description+'</div>';
    html+='<div style="font-size:0.78rem;color:var(--ink3);">'+( t.brand||'')+' &bull; '+( t.category||'')+' &bull; <strong>'+( t.seasonCode||'')+'</strong></div>';
    html+='<div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">';
    html+='<span style="background:#eef2ff;color:#6366f1;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">&pound;'+parseFloat(t.priceTarget||0).toFixed(2)+'</span>';
    if(bids.length) html+='<span style="background:#dbeafe;color:#1e40af;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">'+bids.length+' bid'+( bids.length>1?'s':'')+'</span>';
    html+='<span style="background:'+(daysLeft>3?'#d1fae5':'#fee2e2')+';color:'+(daysLeft>3?'#065f46':'#991b1b')+';padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">'+(daysLeft>0?daysLeft+'d left':'Expired')+'</span>';
    html+='</div></div></div></div>';
  });
  html+='</div>';
  mc.innerHTML=html;
}

function viewTenderDetail(tid){ /* Simplified for v2 */ toast('Tender detail coming in next update'); }

// ── SUPPLIER VIEW ─────────────────────────────────────────────────────────────
function renderSupplierMain(){
  $('filter-bar').classList.add('hidden');
  $('new-dev-btn').classList.add('hidden');
  $('topbar-nav').innerHTML='<button class="nav-btn active" onclick="renderSupplierMain()">Available Tenders</button>';
  var mc=$('main-content');
  var u=G.user; var cats=u.categories||[];
  var available=G.tenders.filter(function(t){
    var catMatch=cats.length===0||cats.indexOf(t.category)>=0;
    var myBid=G.bids.find(function(b){return b.tenderId===t.id&&b.supplierId===u.id;});
    return catMatch&&!myBid&&new Date(t.deadlineDate)>new Date();
  });
  if(available.length===0){mc.innerHTML='<div class="range-board"><div class="empty-state"><div class="empty-state-icon">&#128200;</div><h3>No available tenders</h3><p>New tenders matching your categories will appear here.</p></div></div>'; return;}
  var html='<div class="tenders-grid">';
  available.forEach(function(t){
    var img=(t.files||[]).find(function(f){return f.isImage&&f.dataUrl;});
    html+='<div style="background:white;border:1px solid var(--line);border-radius:16px;padding:1.25rem;">';
    if(img) html+='<img src="'+img.dataUrl+'" style="width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;margin-bottom:1rem;">';
    html+='<div style="font-weight:700;font-size:0.95rem;">'+t.description+'</div>';
    html+='<div style="font-size:0.78rem;color:var(--ink3);margin-bottom:0.75rem;">'+( t.brand||'')+' &bull; '+( t.category||'')+'</div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1rem;">';
    html+='<div style="background:var(--line2);border-radius:8px;padding:0.65rem;"><div style="font-size:0.65rem;color:var(--ink4);font-weight:700;text-transform:uppercase;">Target</div><div style="font-weight:800;color:#6366f1;">&pound;'+parseFloat(t.priceTarget||0).toFixed(2)+'</div></div>';
    html+='<div style="background:var(--line2);border-radius:8px;padding:0.65rem;"><div style="font-size:0.65rem;color:var(--ink4);font-weight:700;text-transform:uppercase;">Qty</div><div style="font-weight:800;">'+( (t.orderQty||0).toLocaleString())+'</div></div></div>';
    html+='<button class="btn btn-primary" style="width:100%;" onclick="supBid(\''+t.id+'\')">Submit Bid</button>';
    html+='</div>';
  });
  html+='</div>';
  mc.innerHTML=html;
}
async function supBid(tid){
  var price=parseFloat(prompt('Your FOB price (£):')); if(isNaN(price)||price<=0) return;
  var lead=parseInt(prompt('Lead time (weeks):')); if(isNaN(lead)||lead<1) return;
  var r=await api('POST','/bids',{tenderId:tid,price:price,leadTime:lead*7,status:'submitted'});
  if(r){toast('Bid submitted!','success'); renderSupplierMain();}
  else toast('Failed to submit bid','error');
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
async function renderAdmin(mc){
  var r=await api('GET','/admin/users');
  var users=r?r.users:[];
  var pending=users.filter(function(u){return u.status==='pending';});
  var all=users;
  mc.innerHTML='<div class="admin-wrap"><h2 class="admin-section-title">Pending Approval ('+(pending.length)+')</h2>'+
    pending.map(function(u){ return userRow(u,true); }).join('')+
    '<h2 class="admin-section-title" style="margin-top:2rem;">All Users ('+(all.length)+')</h2>'+
    all.map(function(u){ return userRow(u,false); }).join('')+'</div>';
}
function userRow(u, showActions){
  return '<div class="user-row"><div><div class="user-row-name">'+u.name+'</div><div class="user-row-meta">'+(u.role||u.type||'')+(u.company?' &bull; '+u.company:'')+'</div></div><span class="user-row-status status-'+u.status+'">'+u.status+'</span>'+(showActions?'<button class="btn btn-green btn-sm" onclick="adminApprove(\''+u.id+'\')">Approve</button><button class="btn btn-danger btn-sm" onclick="adminReject(\''+u.id+'\')">Reject</button>':'')+'</div>';
}
async function adminApprove(uid){ var r=await api('POST','/admin/approve/'+uid); if(r) toast('User approved','success'); else toast('Approve failed','error'); renderAdmin($('main-content')); }
async function adminReject(uid){ var r=await api('POST','/admin/reject/'+uid); if(r) toast('User rejected'); else toast('Reject failed','error'); renderAdmin($('main-content')); }
window.adminApprove=adminApprove; window.adminReject=adminReject;
</script>
