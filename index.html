<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tenderable — Range Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0c0f14;
  --ink2: #3d4450;
  --ink3: #6b7280;
  --ink4: #9ca3af;
  --line: #e5e7eb;
  --line2: #f3f4f6;
  --white: #ffffff;
  --surface: #f8f9fb;

  /* Stage colours */
  --concept: #6366f1;   --concept-bg: #eef2ff;
  --dev: #f59e0b;       --dev-bg: #fffbeb;
  --sampling: #06b6d4;  --sampling-bg: #ecfeff;
  --approved: #10b981;  --approved-bg: #d1fae5;
  --production: #8b5cf6;--production-bg: #ede9fe;
  --dropped: #ef4444;   --dropped-bg: #fee2e2;
  --agreed: #059669;    --agreed-bg: #d1fae5;

  --radius: 12px;
  --card-radius: 16px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "DM Sans", sans-serif; background: var(--surface); color: var(--ink); min-height: 100vh; }
h1,h2,h3,h4 { font-family: "Syne", sans-serif; letter-spacing: -0.4px; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.hidden { display: none !important; }

/* ── LOGIN ───────────────────────────────────────── */
#login-page {
  min-height: 100vh;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
#login-page::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 60% 20%, rgba(99,102,241,0.25) 0%, transparent 60%),
              radial-gradient(ellipse 50% 40% at 20% 80%, rgba(16,185,129,0.15) 0%, transparent 50%);
}
.login-wrap { position: relative; z-index: 10; width: 100%; max-width: 480px; padding: 2rem; }
.login-logo { font-family: "Syne", sans-serif; font-size: 2.5rem; font-weight: 800; color: white; margin-bottom: 0.25rem; letter-spacing: -1px; }
.login-sub { color: rgba(255,255,255,0.45); font-size: 0.9rem; margin-bottom: 3rem; font-weight: 300; }
.login-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 20px; padding: 2rem; }
.login-card label { display: block; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
.login-card input, .login-card select {
  width: 100%; padding: 0.85rem 1rem; background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: white;
  font-size: 1rem; margin-bottom: 1rem; transition: border-color 0.2s;
}
.login-card input::placeholder { color: rgba(255,255,255,0.25); }
.login-card input:focus, .login-card select:focus { outline: none; border-color: rgba(99,102,241,0.8); }
.login-card select option { background: #1a1f2e; color: white; }
.login-btn {
  width: 100%; padding: 0.95rem; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700; letter-spacing: 0.3px;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: white; margin-top: 0.5rem; transition: all 0.2s;
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
.login-toggle { margin-top: 1rem; text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.4); }
.login-toggle button { background: none; border: none; color: rgba(99,102,241,0.8); font-weight: 600; cursor: pointer; }
.pending-msg { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 1rem; color: #fbbf24; font-size: 0.875rem; margin-top: 1rem; text-align: center; }
.error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 0.85rem; color: #fca5a5; font-size: 0.875rem; margin-top: 0.75rem; text-align: center; }

/* ── APP SHELL ───────────────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100vh; }
#app.active { display: flex; }

/* Header */
.topbar {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 0 1.75rem; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-family: "Syne", sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); }
.topbar-logo span { color: #6366f1; }
.topbar-nav { display: flex; gap: 0.25rem; }
.nav-btn {
  background: none; border: none; padding: 0.5rem 0.85rem; border-radius: 8px;
  font-size: 0.83rem; font-weight: 600; color: var(--ink3); transition: all 0.15s; white-space: nowrap;
}
.nav-btn:hover { background: var(--line2); color: var(--ink); }
.nav-btn.active { background: #eef2ff; color: #6366f1; }
.topbar-right { display: flex; align-items: center; gap: 0.75rem; }
.topbar-user { font-size: 0.8rem; color: var(--ink3); }
.topbar-new {
  background: linear-gradient(135deg, #6366f1, #4f46e5); color: white;
  border: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.83rem; font-weight: 700;
  transition: all 0.2s;
}
.topbar-new:hover { box-shadow: 0 4px 14px rgba(99,102,241,0.4); }
.logout-btn { background: none; border: 1px solid var(--line); padding: 0.45rem 0.85rem; border-radius: 8px; font-size: 0.8rem; color: var(--ink3); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; }

/* ── FILTER BAR ──────────────────────────────────── */
.filter-bar {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 0.75rem 1.75rem;
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  position: sticky; top: 58px; z-index: 90;
}
.filter-label { font-size: 0.72rem; font-weight: 700; color: var(--ink4); text-transform: uppercase; letter-spacing: 0.07em; margin-right: 0.25rem; white-space: nowrap; }
.filter-chip {
  display: flex; align-items: center; gap: 0.3rem;
  background: var(--line2); border: 1px solid var(--line); border-radius: 20px;
  padding: 0.3rem 0.7rem; font-size: 0.78rem; color: var(--ink2); cursor: pointer;
  transition: all 0.15s; user-select: none;
}
.filter-chip:hover { border-color: #6366f1; color: #6366f1; background: #eef2ff; }
.filter-chip.active { background: #6366f1; color: white; border-color: #6366f1; }
.filter-chip.active:hover { background: #4f46e5; }
.filter-sep { width: 1px; height: 22px; background: var(--line); margin: 0 0.25rem; flex-shrink: 0; }
.filter-clear { font-size: 0.78rem; color: var(--ink4); background: none; border: none; padding: 0.3rem 0.5rem; border-radius: 6px; }
.filter-clear:hover { color: var(--ink); background: var(--line2); }
.view-toggle { display: flex; gap: 0.25rem; margin-left: auto; }
.view-btn { background: none; border: 1px solid var(--line); padding: 0.4rem 0.65rem; border-radius: 8px; font-size: 0.8rem; color: var(--ink3); }
.view-btn.active { background: var(--ink); color: white; border-color: var(--ink); }

/* ── RANGE BOARD ─────────────────────────────────── */
.range-board { padding: 1.75rem; flex: 1; }
.board-section { margin-bottom: 2.5rem; }
.section-header {
  display: flex; align-items: center; gap: 0.75rem;
  margin-bottom: 1.1rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--line);
}
.section-title { font-size: 1rem; font-weight: 800; color: var(--ink); }
.section-count { background: var(--line2); color: var(--ink3); font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 20px; }
.section-subtotal { margin-left: auto; font-size: 0.78rem; color: var(--ink3); font-weight: 500; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

/* Dev Card */
.dev-card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--card-radius);
  overflow: hidden; cursor: pointer; transition: all 0.2s;
}
.dev-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: #6366f1; }
.dev-card.agreed { border-color: var(--approved); border-width: 2px; }
.card-img { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--line2); }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background: linear-gradient(135deg, #eef2ff, #e0e7ff); }
.card-stage-badge {
  position: absolute; top: 8px; left: 8px;
  padding: 0.2rem 0.55rem; border-radius: 20px; font-size: 0.65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; backdrop-filter: blur(8px);
}
.card-grade-badge {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 800; background: rgba(255,255,255,0.9); color: var(--ink);
}
.card-carousel-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.4); color: white; border: none; width: 26px; height: 26px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; z-index: 2;
}
.dev-card:hover .card-carousel-btn { opacity: 1; }
.card-carousel-btn.prev { left: 6px; }
.card-carousel-btn.next { right: 6px; }
.card-dots { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
.card-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); }
.card-dot.on { background: white; }

.card-body { padding: 0.85rem; }
.card-name { font-size: 0.875rem; font-weight: 700; color: var(--ink); margin-bottom: 0.2rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 0.72rem; color: var(--ink3); margin-bottom: 0.5rem; }
.card-meta { display: flex; justify-content: space-between; align-items: center; }
.card-price { font-size: 0.8rem; font-weight: 700; color: #6366f1; }
.card-supplier { font-size: 0.7rem; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.card-agreed-bar { background: var(--approved-bg); padding: 0.35rem 0.85rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: var(--agreed); font-weight: 600; border-top: 1px solid rgba(16,185,129,0.15); }

/* Stage colours applied */
.stage-concept     { background: var(--concept-bg); color: var(--concept); }
.stage-development { background: var(--dev-bg);     color: #b45309; }
.stage-sampling    { background: var(--sampling-bg);color: #0891b2; }
.stage-approved    { background: var(--approved-bg);color: var(--agreed); }
.stage-production  { background: var(--production-bg);color: #7c3aed; }
.stage-dropped     { background: var(--dropped-bg); color: #b91c1c; }

/* ── PIPELINE VIEW ───────────────────────────────── */
.pipeline-wrap { display: flex; gap: 1rem; padding: 1.75rem; overflow-x: auto; align-items: flex-start; }
.pipeline-col { flex: 0 0 250px; background: var(--line2); border-radius: var(--radius); overflow: hidden; }
.pipeline-header { padding: 0.9rem 1rem; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; display: flex; align-items: center; justify-content: space-between; }
.pipeline-cards { padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 100px; }
.pipeline-card {
  background: white; border-radius: 10px; padding: 0.85rem; cursor: pointer;
  border: 1px solid var(--line); transition: all 0.15s;
}
.pipeline-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.pipeline-card-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.25rem; }
.pipeline-card-sub { font-size: 0.72rem; color: var(--ink3); }
.pipeline-card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 7px; margin-bottom: 0.6rem; }
.pipeline-card-img-ph { width: 100%; aspect-ratio: 16/9; border-radius: 7px; background: var(--line2); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.6rem; }

/* ── DETAIL PANEL (slide-over) ───────────────────── */
.detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
.detail-overlay.open { display: flex; align-items: stretch; justify-content: flex-end; }
.detail-panel {
  width: min(680px, 100vw); background: white; overflow-y: auto;
  display: flex; flex-direction: column;
  animation: slideIn 0.25s ease;
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.detail-head { padding: 1.5rem 1.75rem 1.25rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: white; z-index: 10; }
.detail-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
.detail-title { font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
.detail-close { background: var(--line2); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; color: var(--ink3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.detail-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.detail-pill { padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
.detail-body { padding: 1.5rem 1.75rem; flex: 1; }
.detail-img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
.detail-img-tile { aspect-ratio: 1; border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid var(--line); }
.detail-img-tile img { width: 100%; height: 100%; object-fit: cover; }
.detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
.detail-stat { background: var(--line2); border-radius: 10px; padding: 0.9rem; }
.detail-stat-label { font-size: 0.65rem; font-weight: 700; color: var(--ink4); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.3rem; }
.detail-stat-val { font-size: 1.1rem; font-weight: 800; }
.detail-section-title { font-size: 0.72rem; font-weight: 700; color: var(--ink4); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.75rem; margin-top: 1.25rem; }
.detail-products { display: flex; flex-direction: column; gap: 0.6rem; }
.detail-product-row { display: flex; gap: 0.75rem; align-items: center; background: var(--line2); border-radius: 10px; padding: 0.75rem; }
.detail-product-img { width: 44px; height: 44px; border-radius: 7px; object-fit: cover; flex-shrink: 0; background: var(--line); }
.detail-product-img-ph { width: 44px; height: 44px; border-radius: 7px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
.detail-product-name { font-size: 0.875rem; font-weight: 600; }
.detail-product-sub { font-size: 0.72rem; color: var(--ink3); }
.detail-product-price { margin-left: auto; font-size: 0.85rem; font-weight: 700; color: #6366f1; flex-shrink: 0; }
.detail-actions { padding: 1.25rem 1.75rem; border-top: 1px solid var(--line); display: flex; gap: 0.5rem; flex-wrap: wrap; }
.btn { padding: 0.6rem 1.1rem; border-radius: 9px; font-size: 0.85rem; font-weight: 700; border: none; transition: all 0.15s; }
.btn-primary { background: linear-gradient(135deg,#6366f1,#4f46e5); color: white; }
.btn-primary:hover { box-shadow: 0 4px 14px rgba(99,102,241,0.4); }
.btn-cyan { background: linear-gradient(135deg,#06b6d4,#0891b2); color: white; }
.btn-green { background: linear-gradient(135deg,#10b981,#059669); color: white; }
.btn-ghost { background: var(--line2); color: var(--ink2); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--line); }
.btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.btn-sm { padding: 0.45rem 0.85rem; font-size: 0.78rem; border-radius: 7px; }

/* Comments */
.comment-thread { margin-top: 1.25rem; }
.comment-item { display: flex; gap: 0.75rem; margin-bottom: 0.85rem; }
.comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: #6366f1; flex-shrink: 0; }
.comment-bubble { flex: 1; background: var(--line2); border-radius: 10px; padding: 0.7rem 0.9rem; }
.comment-meta { display: flex; justify-content: space-between; margin-bottom: 0.3rem; }
.comment-author { font-size: 0.78rem; font-weight: 700; color: var(--ink); }
.comment-time { font-size: 0.7rem; color: var(--ink4); }
.comment-text { font-size: 0.85rem; color: var(--ink2); line-height: 1.5; }
.comment-input-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
.comment-input { flex: 1; padding: 0.65rem 0.9rem; border: 1px solid var(--line); border-radius: 9px; font-size: 0.875rem; font-family: inherit; }
.comment-input:focus { outline: none; border-color: #6366f1; }
.comment-post { padding: 0.65rem 1rem; background: linear-gradient(135deg,#10b981,#059669); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 0.85rem; }

/* ── CREATE / EDIT FORM ──────────────────────────── */
.form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: none; overflow-y: auto; padding: 2rem 1rem; }
.form-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.form-sheet { background: white; border-radius: 20px; width: 100%; max-width: 780px; overflow: hidden; }
.form-head { padding: 1.5rem 2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.form-title { font-size: 1.2rem; font-weight: 800; }
.form-close { background: var(--line2); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; color: var(--ink3); }
.form-body { padding: 1.75rem 2rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.form-group { display: flex; flex-direction: column; gap: 0.45rem; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 0.75rem; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; }
.form-input {
  padding: 0.75rem 0.9rem; border: 1px solid var(--line); border-radius: 9px;
  font-size: 0.9rem; font-family: inherit; transition: border-color 0.15s;
  background: var(--line2);
}
.form-input:focus { outline: none; border-color: #6366f1; background: white; }
.form-section-head { font-size: 0.72rem; font-weight: 700; color: var(--ink4); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 1.5rem; margin-bottom: 0.75rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.form-foot { padding: 1.25rem 2rem; border-top: 1px solid var(--line); display: flex; gap: 0.75rem; justify-content: flex-end; }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--line); border-radius: 12px; padding: 2rem; text-align: center;
  cursor: pointer; background: var(--line2); transition: all 0.2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: #6366f1; background: #eef2ff; }
.upload-zone p { font-size: 0.875rem; color: var(--ink3); }
.upload-zone strong { color: #6366f1; }
.file-previews { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.75rem; }
.file-thumb { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.file-thumb img { width: 100%; height: 100%; object-fit: cover; }
.file-thumb-remove { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.5); color: white; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; }

/* Product rows in form */
.product-row-wrap { display: flex; flex-direction: column; gap: 0.6rem; }
.product-row { background: var(--line2); border-radius: 10px; padding: 0.85rem; display: flex; gap: 0.6rem; align-items: flex-start; }
.product-row-img { width: 60px; height: 60px; flex-shrink: 0; border-radius: 8px; border: 2px dashed var(--line); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
.product-row-img img { width: 100%; height: 100%; object-fit: cover; }
.product-row-fields { flex: 1; display: grid; grid-template-columns: 2fr 1.2fr 0.8fr 0.9fr; gap: 0.5rem; }
.product-row-del { background: none; border: none; color: var(--ink4); font-size: 1.1rem; padding: 0.25rem; flex-shrink: 0; }
.product-row-del:hover { color: #ef4444; }
.add-row-btn { background: none; border: 2px dashed var(--line); border-radius: 9px; padding: 0.65rem; font-size: 0.82rem; color: var(--ink3); width: 100%; font-weight: 600; transition: all 0.15s; }
.add-row-btn:hover { border-color: #6366f1; color: #6366f1; background: #eef2ff; }

/* Stage progress bar */
.stage-progress { display: flex; gap: 0; margin-bottom: 1.5rem; }
.stage-step {
  flex: 1; padding: 0.5rem 0.25rem; text-align: center; font-size: 0.65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
  background: var(--line2); color: var(--ink4); transition: all 0.15s;
  border-right: 1px solid var(--line);
}
.stage-step:first-child { border-radius: 9px 0 0 9px; }
.stage-step:last-child { border-radius: 0 9px 9px 0; border-right: none; }
.stage-step.on.concept     { background: var(--concept-bg); color: var(--concept); }
.stage-step.on.development { background: var(--dev-bg); color: #b45309; }
.stage-step.on.sampling    { background: var(--sampling-bg); color: #0891b2; }
.stage-step.on.approved    { background: var(--approved-bg); color: var(--agreed); }
.stage-step.on.production  { background: var(--production-bg); color: #7c3aed; }
.stage-step.on.dropped     { background: var(--dropped-bg); color: #b91c1c; }

/* ── IMAGE MODAL ─────────────────────────────────── */
#img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; align-items: center; justify-content: center; }
#img-modal.open { display: flex; }
#img-modal img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.15); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
.modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; }
.modal-prev { left: 1rem; }
.modal-next { right: 1rem; }
.modal-counter { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: white; padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.8rem; }

/* ── TENDERS TAB (simplified secondary) ──────────── */
.tenders-grid { padding: 1.75rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(460px,1fr)); gap: 1.25rem; }

/* ── ADMIN ───────────────────────────────────────── */
.admin-wrap { padding: 1.75rem; max-width: 860px; }
.admin-section-title { font-size: 1rem; font-weight: 800; margin-bottom: 1rem; }
.user-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: white; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 0.5rem; }
.user-row-name { font-weight: 700; font-size: 0.9rem; flex: 1; }
.user-row-meta { font-size: 0.78rem; color: var(--ink3); }
.user-row-status { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 20px; }
.status-pending { background: #fef3c7; color: #b45309; }
.status-approved { background: var(--approved-bg); color: var(--agreed); }
.status-rejected { background: var(--dropped-bg); color: #b91c1c; }

/* ── MOBILE ──────────────────────────────────────── */
@media (max-width: 768px) {
  .topbar { padding: 0 1rem; }
  .topbar-nav { display: none; }
  .filter-bar { top: 58px; padding: 0.6rem 1rem; }
  .range-board { padding: 1rem; }
  .card-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
  .pipeline-wrap { padding: 1rem; }
  .detail-stats { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .product-row-fields { grid-template-columns: 1fr 1fr; }
  .tenders-grid { padding: 1rem; grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  .card-grid { grid-template-columns: repeat(2,1fr); gap: 0.5rem; }
}

/* ── EMPTY STATE ─────────────────────────────────── */
.empty-state { text-align: center; padding: 4rem 2rem; color: var(--ink4); }
.empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
.empty-state h3 { font-size: 1.1rem; color: var(--ink2); margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.875rem; }

/* Loading */
.loading-bar { height: 3px; background: linear-gradient(90deg, #6366f1, #10b981); position: fixed; top: 0; left: 0; width: 0; z-index: 9999; transition: width 0.3s; }
.loading-bar.loading { width: 70%; }
.loading-bar.done { width: 100%; opacity: 0; transition: width 0.2s, opacity 0.3s 0.2s; }

/* Supplier section in form */
.supplier-picker-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 400; display: none; align-items: center; justify-content: center; }
.supplier-picker-modal.open { display: flex; }
.supplier-picker-box { background: white; border-radius: 16px; padding: 1.5rem; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }

/* Toast */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--ink); color: white; padding: 0.85rem 1.25rem; border-radius: 12px; font-size: 0.875rem; font-weight: 600; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.25s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: #059669; }
.toast.error { background: #dc2626; }
</style>
</head>
<body>

<!-- Loading bar -->
<div class="loading-bar" id="loading-bar"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Image modal -->
<div id="img-modal">
  <button class="modal-close" onclick="closeImgModal()">&#10005;</button>
  <button class="modal-nav modal-prev" id="modal-prev" onclick="modalNav(-1)">&#8249;</button>
  <img id="modal-img" src="" alt="">
  <button class="modal-nav modal-next" id="modal-next" onclick="modalNav(1)">&#8250;</button>
  <div class="modal-counter" id="modal-counter"></div>
</div>

<!-- Login -->
<div id="login-page">
  <div class="login-wrap">
    <div class="login-logo">Tenderable</div>
    <div class="login-sub">Range Studio — Development Tracking Platform</div>
    <div class="login-card">
      <div id="login-form">
        <label>Name</label>
        <input type="text" id="login-name" placeholder="Your full name" autocomplete="name">
        <label>PIN</label>
        <input type="password" id="login-pin" placeholder="4-digit PIN" maxlength="6" inputmode="numeric">
        <button class="login-btn" onclick="doLogin()">Sign In</button>
        <div class="login-toggle">New user? <button onclick="showRegister()">Create account</button></div>
      </div>
      <div id="register-form" style="display:none;">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your full name">
        <label>PIN (4-6 digits)</label>
        <input type="password" id="reg-pin" placeholder="Choose a PIN" maxlength="6" inputmode="numeric">
        <label>Role</label>
        <select id="reg-role">
          <option value="">Select role</option>
          <option value="buyer">Buyer</option>
          <option value="supplier">Supplier</option>
          <option value="stakeholder">Stakeholder</option>
        </select>
        <label>Company / Brand</label>
        <input type="text" id="reg-company" placeholder="e.g. BadRhino">
        <div id="reg-cats-wrap" style="display:none;">
          <label>Supplier Categories</label>
          <div id="reg-cats" style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1rem;"></div>
        </div>
        <button class="login-btn" onclick="doRegister()">Create Account</button>
        <div class="login-toggle">Already registered? <button onclick="showLogin()">Sign in</button></div>
      </div>
      <div id="login-msg"></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <nav class="topbar">
    <div class="topbar-logo">Tender<span>able</span></div>
    <div class="topbar-nav" id="topbar-nav"></div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="topbar-new hidden" id="new-dev-btn" onclick="openCreateDev()">+ New Development</button>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </nav>

  <!-- Filter bar (buyer only) -->
  <div class="filter-bar hidden" id="filter-bar">
    <span class="filter-label">Filter</span>
    <div id="filter-season" style="display:contents;"></div>
    <div class="filter-sep"></div>
    <div id="filter-stage" style="display:contents;"></div>
    <div class="filter-sep"></div>
    <div id="filter-cat" style="display:contents;"></div>
    <div class="filter-sep"></div>
    <div id="filter-grade" style="display:contents;"></div>
    <div class="filter-sep"></div>
    <div id="filter-supplier" style="display:contents;"></div>
    <button class="filter-clear" onclick="clearFilters()" id="filter-clear-btn" style="display:none;">&#10005; Clear</button>
    <div class="view-toggle">
      <button class="view-btn active" id="view-board" onclick="setView('board')">&#9641; Board</button>
      <button class="view-btn" id="view-pipeline" onclick="setView('pipeline')">&#9776; Pipeline</button>
    </div>
  </div>

  <div class="main" id="main-content"></div>
</div>

<!-- Detail slide-over -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetailIfBg(event)">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<!-- Create/Edit form overlay -->
<div class="form-overlay" id="form-overlay" onclick="closeFormIfBg(event)">
  <div class="form-sheet" id="form-sheet">
    <div class="form-head">
      <div class="form-title" id="form-title">New Development</div>
      <button class="form-close" onclick="closeForm()">&#10005;</button>
    </div>
    <div class="form-body" id="form-body"></div>
    <div class="form-foot">
      <button class="btn btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn btn-ghost" id="form-save-dev-btn" onclick="submitDev(false)" style="display:none;">Save to Board</button>
      <button class="btn btn-primary" id="form-submit-btn" onclick="submitDev(true)">Save Development</button>
    </div>
  </div>
</div>

<!-- Supplier picker -->
<div class="supplier-picker-modal" id="sup-picker">
  <div class="supplier-picker-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="font-size:1rem;font-weight:800;">Select Suppliers</h3>
      <button class="form-close" onclick="closeSupPicker()">&#10005;</button>
    </div>
    <input class="form-input" id="sup-search" placeholder="Search..." oninput="filterSupPicker()" style="margin-bottom:0.75rem;">
    <div id="sup-list"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="closeSupPicker()">Done</button>
  </div>
</div>

<script>
const API = 'https://tenderable-production.up.railway.app';
const STAGES = ['concept','development','sampling','approved','production','dropped'];
const STAGE_LABELS = {concept:'Concept',development:'Development',sampling:'Sampling',approved:'Approved',production:'Production',dropped:'Dropped'};
const CATS = ['OUTERWEAR','TOPS','BOTTOMS','UNDERWEAR','NIGHTWEAR','SWIMWEAR','ACCESSORIES','FOOTWEAR'];
const BRANDS = ['BadRhino',"Evan\'s",'Long Tall Sally','Pixie Girl','M&Co','Star x JM'];
const GRADES = ['A','B','C','D'];

var G = {
  user: null, devs: [], tenders: [], bids: [], messages: [],
  devComments: {}, allSuppliers: [],
  filters: { season:'', stage:'', cat:'', grade:'', supplier:'' },
  view: 'board', editId: null, editType: null,
  uploadedFiles: [], editUploadedFiles: [],
  invitedSuppliers: [], formProducts: [],
  _modalImgs: [], _modalIdx: 0,
  _pollTimer: null
};

// ── UTILS ──────────────────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function toast(msg, type){ var t=$('toast'); t.textContent=msg; t.className='toast show '+(type||''); setTimeout(function(){ t.className='toast'; },2800); }
function loading(on){ var b=$('loading-bar'); b.className='loading-bar '+(on?'loading':'done'); if(!on) setTimeout(function(){ b.className='loading-bar'; },600); }
async function api(method, path, body){
  try {
    var opts = { method: method, headers: {'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    var u = G.user;
    if (u) { opts.headers['X-User-Id'] = u.id; opts.headers['X-User-Name'] = u.name; opts.headers['X-User-Role'] = u.type; opts.headers['X-User-Company'] = u.company||''; }
    var r = await fetch(API + path, opts);
    if (!r.ok) { var e = await r.json().catch(function(){ return {}; }); throw new Error(e.error||r.status); }
    return r.json();
  } catch(e) { console.warn(method, path, e.message); return null; }
}
function stageClass(s){ return 'stage-'+(s||'concept'); }
function devStats(d){
  var prods=(d.products||[]).filter(function(p){return p.description;});
  if(!prods.length) return {avgCost:d.priceTarget||0, avgRetail:0, totalQty:d.orderQty||0, count:0};
  var totalCost=0, totalRetail=0, totalQty=0;
  prods.forEach(function(p){ totalCost+=parseFloat(p.targetCost||0); totalRetail+=parseFloat(p.retailPrice||0); totalQty+=parseInt(p.qty||0); });
  return { avgCost:totalCost/prods.length, avgRetail:totalRetail/prods.length, totalQty:totalQty, count:prods.length };
}
function stagePill(s){ return '<span class="card-stage-badge '+stageClass(s)+'">'+((STAGE_LABELS[s]||s||'Concept'))+'</span>'; }
function detailPill(s, extra){ return '<span class="detail-pill '+stageClass(s)+'">'+(STAGE_LABELS[s]||s||'Concept')+(extra?' &bull; '+extra:'')+'</span>'; }
function initials(name){ if(!name) return '?'; return name.split(' ').map(function(w){return w[0];}).join('').substring(0,2).toUpperCase(); }

// ── AUTH ───────────────────────────────────────────────────────────────────
function showRegister(){ $('login-form').style.display='none'; $('register-form').style.display=''; $('login-msg').innerHTML=''; }
function showLogin(){ $('login-form').style.display=''; $('register-form').style.display='none'; $('login-msg').innerHTML=''; }
document.getElementById('reg-role').addEventListener('change', function(){ $('reg-cats-wrap').style.display = this.value==='supplier' ? '' : 'none'; renderRegCats(); });
function renderRegCats(){
  var el = $('reg-cats'); el.innerHTML='';
  CATS.forEach(function(c){
    var btn = document.createElement('button');
    btn.type='button'; btn.textContent=c;
    btn.style.cssText='border:1px solid var(--line);background:var(--line2);padding:0.3rem 0.65rem;border-radius:20px;font-size:0.78rem;cursor:pointer;';
    btn.dataset.cat=c; btn.dataset.on='0';
    btn.onclick=function(){ this.dataset.on=this.dataset.on==='0'?'1':'0'; this.style.background=this.dataset.on==='1'?'#6366f1':''; this.style.color=this.dataset.on==='1'?'white':''; this.style.borderColor=this.dataset.on==='1'?'#6366f1':''; };
    el.appendChild(btn);
  });
}
async function doLogin(){
  var name=$('login-name').value.trim(), pin=$('login-pin').value.trim();
  if(!name||!pin){ $('login-msg').innerHTML='<div class="error-msg">Please enter your name and PIN</div>'; return; }
  loading(true);
  var r = await api('POST','/auth/login',{name,pin});
  loading(false);
  if(!r||r.error){ $('login-msg').innerHTML='<div class="error-msg">'+(r&&r.error?r.error:'Invalid name or PIN')+'</div>'; return; }
  var u = r.user || r;
  if(u.status==='pending'){ $('login-msg').innerHTML='<div class="pending-msg">Your account is awaiting approval.</div>'; return; }
  if(u.status==='rejected'){ $('login-msg').innerHTML='<div class="error-msg">Your account has been rejected.</div>'; return; }
  G.user = Object.assign({}, u, { type: u.type || u.role });
  await loadData();
  startApp();
}
async function doRegister(){
  var name=$('reg-name').value.trim(), pin=$('reg-pin').value.trim(), role=$('reg-role').value, company=$('reg-company').value.trim();
  if(!name||!pin||!role){ $('login-msg').innerHTML='<div class="error-msg">Please fill all required fields</div>'; return; }
  var cats=[]; if(role==='supplier') $('reg-cats').querySelectorAll('[data-on="1"]').forEach(function(b){cats.push(b.dataset.cat);});
  loading(true);
  var r = await api('POST','/auth/register',{name,pin,role,company,categories:cats});
  loading(false);
  if(!r||r.error){ $('login-msg').innerHTML='<div class="error-msg">'+(r&&r.error?r.error:'Registration failed')+'</div>'; return; }
  if(r.pending){ $('login-msg').innerHTML='<div class="pending-msg">Account created! Waiting for Harley to approve.</div>'; showLogin(); return; }
  var u = r.user || r;
  if(!u.id){ $('login-msg').innerHTML='<div class="pending-msg">Account created! Waiting for Harley to approve.</div>'; showLogin(); return; }
  G.user = Object.assign({}, u, { type: u.type || u.role });
  await loadData();
  startApp();
}
function doLogout(){
  stopPolling();
  G.user=null;
  $('app').classList.remove('active');
  $('login-page').style.display='';
  $('login-msg').innerHTML='';
  $('login-name').value='';
  $('login-pin').value='';
}

// ── DATA ────────────────────────────────────────────────────────────────────
async function loadData(){
  if(!G.user) return;
  var u=G.user, co=encodeURIComponent(u.company||''), role=encodeURIComponent(u.type||'');
  var cats=encodeURIComponent((u.categories||[]).join(','));
  var dParams='?role='+role+'&company='+co;
  var tParams='?role='+role+'&company='+co+'&categories='+cats+'&supplierCompany='+co;
  var [dRes,tRes,bRes,mRes] = await Promise.all([
    api('GET','/developments'+dParams),
    api('GET','/tenders'+tParams),
    api('GET','/bids?role='+role+'&company='+co),
    api('GET','/messages')
  ]);
  if(dRes&&dRes.developments) G.devs=dRes.developments;
  if(dRes&&dRes.devComments) G.devComments=dRes.devComments;
  if(tRes&&tRes.tenders) G.tenders=tRes.tenders.map(function(t){ return Object.assign({},t,{deadlineDate:new Date(t.deadlineDate)}); });
  if(bRes&&bRes.bids) G.bids=bRes.bids;
  if(mRes&&mRes.messages) G.messages=mRes.messages;
}

function startPolling(){ G._pollTimer=setInterval(async function(){ await loadData(); if(G.view==='board'||G.view==='pipeline') renderMainContent(); },45000); }
function stopPolling(){ if(G._pollTimer){ clearInterval(G._pollTimer); G._pollTimer=null; } }

// ── APP START ───────────────────────────────────────────────────────────────
function startApp(){
  $('login-page').style.display='none';
  $('app').classList.add('active');
  var u=G.user;
  $('topbar-user').textContent=u.name+' &bull; '+(u.company||u.type);
  $('topbar-user').innerHTML=u.name+' <span style="color:var(--ink4);">&bull; '+(u.company||u.type)+'</span>';
  buildTopbarNav();
  if(u.type==='buyer'||u.type==='stakeholder'){
    $('filter-bar').classList.remove('hidden');
    $('new-dev-btn').classList.remove('hidden');
    buildFilters();
    renderMainContent();
  } else {
    renderSupplierMain();
  }
  startPolling();
}

function buildTopbarNav(){
  var u=G.user; var nav=$('topbar-nav'); nav.innerHTML='';
  var tabs = u.type==='buyer'||u.type==='stakeholder'
    ? [{id:'board',label:'Range Board'},{id:'pipeline',label:'Pipeline'},{id:'admin',label:'Admin',admin:true}]
    : [{id:'available',label:'Available'},{id:'active',label:'Active'},{id:'accepted',label:'Accepted'}];
  tabs.forEach(function(t){
    if(t.admin && u.name!=='Harley Killingsworth') return;
    var b=document.createElement('button');
    b.className='nav-btn'+(G.view===t.id?' active':'');
    b.textContent=t.label; b.dataset.view=t.id;
    b.onclick=function(){
      document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      switchView(t.id);
    };
    nav.appendChild(b);
  });
}

function switchView(v){
  G.view=v;
  if(v==='board'||v==='pipeline'){
    $('filter-bar').classList.remove('hidden');
  } else {
    $('filter-bar').classList.add('hidden');
  }
  renderMainContent();
}
function setView(v){ G.view=v; $('view-board').classList.toggle('active',v==='board'); $('view-pipeline').classList.toggle('active',v==='pipeline'); renderMainContent(); }

// ── FILTERS ─────────────────────────────────────────────────────────────────
function buildFilters(){
  // Seasons from devs
  var seasons=['All']; G.devs.forEach(function(d){ if(d.seasonCode&&!seasons.includes(d.seasonCode)) seasons.push(d.seasonCode); });
  buildChips('filter-season', seasons, 'season', 'Season');
  buildChips('filter-stage', ['All'].concat(STAGES.map(function(s){return {val:s,label:STAGE_LABELS[s]};})), 'stage', 'Stage');
  buildChips('filter-cat', ['All'].concat(CATS), 'cat', 'Cat');
  buildChips('filter-grade', ['All','A','B','C','D'], 'grade', 'Grade');
  // Suppliers
  var sups=['All']; G.devs.forEach(function(d){ if(d.supplierAllocation&&!sups.includes(d.supplierAllocation)) sups.push(d.supplierAllocation); });
  buildChips('filter-supplier', sups, 'supplier', 'Supplier');
}
function buildChips(containerId, items, filterKey, label){
  var el=$(containerId); el.innerHTML='<span class="filter-chip" style="background:none;border:none;color:var(--ink4);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;padding-left:0;">'+label+'</span>';
  items.forEach(function(item){
    var val = typeof item==='object' ? item.val : item;
    var lbl = typeof item==='object' ? item.label : item;
    if(val==='All'&&lbl==='All') lbl='All';
    var chip=document.createElement('button');
    chip.className='filter-chip'+(G.filters[filterKey]===(val==='All'?'':val)?' active':'');
    chip.textContent=lbl;
    chip.onclick=function(){
      G.filters[filterKey] = (val==='All')?'' : (G.filters[filterKey]===val?'':val);
      buildFilters();
      renderMainContent();
      updateClearBtn();
    };
    el.appendChild(chip);
  });
}
function updateClearBtn(){
  var any=Object.values(G.filters).some(function(v){return v!=='';});
  $('filter-clear-btn').style.display=any?'':'none';
}
function clearFilters(){ G.filters={season:'',stage:'',cat:'',grade:'',supplier:''}; buildFilters(); renderMainContent(); $('filter-clear-btn').style.display='none'; }

function filteredDevs(){
  return G.devs.filter(function(d){
    if(G.filters.season&&d.seasonCode!==G.filters.season) return false;
    if(G.filters.stage&&(d.stage||'concept')!==G.filters.stage) return false;
    if(G.filters.cat&&d.category!==G.filters.cat) return false;
    if(G.filters.grade&&(d.storeGrade||'')!==G.filters.grade) return false;
    if(G.filters.supplier&&(d.supplierAllocation||'').toLowerCase()!==G.filters.supplier.toLowerCase()) return false;
    return true;
  });
}

// ── MAIN CONTENT ─────────────────────────────────────────────────────────────
function renderMainContent(){
  var mc=$('main-content');
  if(G.view==='board') renderBoard(mc);
  else if(G.view==='pipeline') renderPipeline(mc);
  else if(G.view==='tenders') renderTenders(mc);
  else if(G.view==='admin') renderAdmin(mc);
}

// ── RANGE BOARD ───────────────────────────────────────────────────────────────
function renderBoard(mc){
  var devs=filteredDevs();
  if(devs.length===0){ mc.innerHTML='<div class="range-board"><div class="empty-state"><div class="empty-state-icon">&#127912;</div><h3>No developments found</h3><p>Create your first development or adjust your filters.</p></div></div>'; return; }
  var grouped={}; CATS.forEach(function(c){grouped[c]=[];}); grouped.__other=[];
  devs.forEach(function(d){ if(grouped[d.category]) grouped[d.category].push(d); else grouped.__other.push(d); });
  var html='<div class="range-board">';
  CATS.forEach(function(cat){
    if(grouped[cat].length===0) return;
    var total=grouped[cat].reduce(function(s,d){var st=devStats(d);return s+st.avgCost;},0);
    html+='<div class="board-section">';
    html+='<div class="section-header"><span class="section-title">'+cat+'</span><span class="section-count">'+grouped[cat].length+'</span><span class="section-subtotal">Avg target: &pound;'+( grouped[cat].length?(total/grouped[cat].length).toFixed(2):'0.00')+'</span></div>';
    html+='<div class="card-grid">';
    grouped[cat].forEach(function(d){ html+=devCard(d); });
    html+='</div></div>';
  });
  if(grouped.__other.length>0){
    html+='<div class="board-section"><div class="section-header"><span class="section-title">Other</span><span class="section-count">'+grouped.__other.length+'</span></div><div class="card-grid">';
    grouped.__other.forEach(function(d){ html+=devCard(d); });
    html+='</div></div>';
  }
  html+='</div>';
  mc.innerHTML=html;
}

function devCard(d){

  return '<div class="dev-card'+(d.status==='agreed_offline'?' agreed':'')+'" onclick="openDetail(\''+d.id+'\')">'+imgHtml+'<div class="card-body"><div class="card-name">'+d.description+'</div><div class="card-sub">'+( d.brand||'')+' &bull; '+(d.seasonCode||'')+( d.department?' &bull; '+d.department:'')+'</div><div class="card-meta"><span class="card-price">&pound;'+parseFloat(d.priceTarget||0).toFixed(2)+'</span><span class="card-supplier">'+( d.supplierAllocation||'')+'</span></div></div>'+agreedBar+'</div>';

function carNav(btn){
  var carId=btn.dataset.carid, dir=parseInt(btn.dataset.cardir), total=parseInt(btn.dataset.cartotal);
  var car=document.getElementById(carId); if(!car) return;
  var imgs=car.querySelectorAll('.carr-img'); var cur=0;
  imgs.forEach(function(im,i){if(im.style.display!=='none') cur=i;});
  var next=(cur+dir+total)%total;
  imgs.forEach(function(im,i){im.style.display=i===next?'block':'none';});
  for(var i=0;i<total;i++){var dot=document.getElementById(carId+'-dot-'+i); if(dot) dot.className='card-dot'+(i===next?' on':'');}
}

async function postComment(devId){

  var r=await api('POST','/developments/'+devId+'/comments',{comment:txt});

    G.devComments[devId].push({userName:G.user.name,comment:txt,createdAt:new Date().toISOString()});

function fDragLeave(){ $('f-drop').classList.remove('drag'); }
function fDrop(e){ e.preventDefault(); $('f-drop').classList.remove('drag'); fProcessFiles(e.dataTransfer.files); }
function fHandleFiles(e){ fProcessFiles(e.target.files); }
function fProcessFiles(files){
  for(var i=0;i<files.length;i++){
    if(!files[i].type.startsWith('image/')) continue;
    (function(file){
      var r=new FileReader();
      r.onload=function(ev){ G.uploadedFiles.push({name:file.name,size:file.size,isImage:true,dataUrl:ev.target.result}); renderFormPreviews(); };
      r.readAsDataURL(file);
    })(files[i]);
  }
}
function renderFormPreviews(){
  var el=$('f-previews'); if(!el) return;
  el.innerHTML=G.uploadedFiles.map(function(f,i){
    return '<div class="file-thumb"><img src="'+f.dataUrl+'"><button type="button" class="file-thumb-remove" onclick="removeUpload('+i+')">&#10005;</button></div>';
  }).join('');
}
function removeUpload(i){ G.uploadedFiles.splice(i,1); renderFormPreviews(); }

// Paste handler
document.addEventListener('paste',function(e){
  var overlay=$('form-overlay');
  if(!overlay||!overlay.classList.contains('open')) return;
  var items=e.clipboardData&&e.clipboardData.items;
  if(!items) return;
  var hasImg=false;
  for(var i=0;i<items.length;i++){if(items[i].kind==='file'&&items[i].type.startsWith('image/')){hasImg=true;break;}}
  if(!hasImg) return;
  e.preventDefault();
  for(var i=0;i<items.length;i++){
    if(items[i].kind==='file'&&items[i].type.startsWith('image/')){
      (function(item){
        var f=item.getAsFile();
        var r=new FileReader();
        r.onload=function(ev){G.uploadedFiles.push({name:'pasted-'+Date.now()+'.png',size:f.size,isImage:true,dataUrl:ev.target.result});renderFormPreviews();};
        r.readAsDataURL(f);
      })(items[i]);
    }
  }
});

function addProductRow(data){
  var d=data||{};
  var row=document.createElement('div');
  row.className='product-row';
  var pidx=G.formProducts.length;
  G.formProducts.push({description:d.description||'',colour:d.colour||'',qty:d.qty||'',price:d.price||'',image:d.image||null});

  var imgWrap=document.createElement('div');
  imgWrap.className='product-row-img';
  if(d.image){ imgWrap.innerHTML='<img src="'+d.image+'" style="width:100%;height:100%;object-fit:cover;">'; imgWrap.style.border='2px solid var(--approved)'; }
  else imgWrap.innerHTML='<span style="font-size:1.3rem;color:var(--ink4);">&#128247;</span>';
  imgWrap.setAttribute('data-imgurl',d.image||'');
  var fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none';
  fi.addEventListener('change',function(){
    if(!this.files[0]) return;
    var r=new FileReader(); var wrap=imgWrap; var idx=pidx;
    r.onload=function(ev){wrap.innerHTML='<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover;">'; wrap.style.border='2px solid var(--approved)'; wrap.setAttribute('data-imgurl',ev.target.result); G.formProducts[idx].image=ev.target.result;};
    r.readAsDataURL(this.files[0]);
  });
  imgWrap.appendChild(fi);
  imgWrap.addEventListener('click',function(){fi.click();});
  imgWrap.addEventListener('dragover',function(e){e.preventDefault();this.style.borderColor='#6366f1';});
  imgWrap.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0]){fi.files=e.dataTransfer.files;fi.dispatchEvent(new Event('change'));}});

  var fields=document.createElement('div');
  fields.className='product-row-fields';
  ['product-desc','product-colour','product-qty','product-price'].forEach(function(cls,i){
    var inp=document.createElement('input');
    inp.className='form-input '+cls; inp.style.padding='0.55rem 0.7rem'; inp.style.fontSize='0.82rem';
    var vals=[d.description||'',d.colour||'',d.qty||'',d.price||''];
    var phs=['Product name','Colourway','Qty','£ Price'];
    inp.value=vals[i]; inp.placeholder=phs[i];
    if(i===2||i===3){inp.type='number'; inp.min='0'; inp.step=i===3?'0.01':'1';}
    var key=['description','colour','qty','price'][i];
    inp.addEventListener('input',function(){G.formProducts[pidx][key]=this.value;});
    fields.appendChild(inp);
  });

  var del=document.createElement('button');
  del.type='button'; del.className='product-row-del'; del.innerHTML='&#10005;';
  del.onclick=function(){row.remove(); G.formProducts[pidx]={_deleted:true};};

  row.appendChild(imgWrap); row.appendChild(fields); row.appendChild(del);
  $('f-products').appendChild(row);
}
function renderFormProducts(){ $('f-products').innerHTML=''; G.formProducts.forEach(function(p){ if(!p._deleted) addProductRow(p); }); G.formProducts=[]; }

async function submitDev(){
  var desc=$('f-desc').value.trim();
  if(!desc){toast('Please enter a description','error');return;}
  var products=[]; $('f-products').querySelectorAll('.product-row').forEach(function(row){
    var d=row.querySelector('.product-desc'); var c=row.querySelector('.product-colour');
    var q=row.querySelector('.product-qty'); var p=row.querySelector('.product-price');
    var imgWrap=row.querySelector('div[data-imgurl]');
    var name=d?d.value.trim():''; if(!name) return;
    products.push({description:name,colour:c?c.value.trim():'',qty:parseInt(q?q.value:0)||0,price:parseFloat(p?p.value:0)||0,image:imgWrap?imgWrap.getAttribute('data-imgurl')||null:null});
  });
  var body={
    description:desc,brand:$('f-brand').value,category:$('f-cat').value,seasonCode:$('f-season').value,
    stage:$('f-stage').value||'concept',storeGrade:$('f-grade').value||null,department:$('f-dept').value||null,
    supplierAllocation:$('f-supplier').value.trim()||null,fabric:$('f-fabric').value.trim(),
    priceTarget:0, orderQty:parseInt($('f-qty').value)||0,
    leadTimeTarget:parseInt($('f-lead').value)||null,labellingReqs:$('f-notes').value.trim(),
    files:G.uploadedFiles,products:products
  };
  loading(true);
  var r;
  if(G.editId){
    r=await api('PUT','/developments/'+G.editId,body);
    if(r){var idx=G.devs.findIndex(function(d){return d.id===G.editId;}); if(idx>=0) G.devs[idx]=Object.assign(G.devs[idx],body,{id:G.editId});}
  } else {
    r=await api('POST','/developments',body);
    if(r&&r.development) G.devs.unshift(r.development);
  }
  loading(false);
  if(r){closeForm();buildFilters();renderMainContent();toast(G.editId?'Development updated':'Development created','success');}
  else toast('Save failed','error');
}

// ── AGREED OFFLINE ────────────────────────────────────────────────────────────
async function agreedOffline(devId){
  var d=G.devs.find(function(x){return x.id===devId;}); if(!d) return;
  var st=devStats(d); var price=prompt('Agreed price (FOB £):', d.agreedPrice||st.avgCost||'');
  if(price===null) return;
  price=parseFloat(price); if(isNaN(price)||price<=0){toast('Invalid price','error');return;}
  var sup=prompt('Supplier name:',d.agreedSupplier||d.supplierAllocation||'');
  if(sup===null) return;
  d.agreedPrice=price; d.agreedSupplier=sup.trim(); d.status='agreed_offline'; d.agreedAt=new Date().toISOString();
  await api('PUT','/developments/'+devId,{agreedPrice:price,agreedSupplier:d.agreedSupplier,status:'agreed_offline',agreedAt:d.agreedAt});
  closeDetail(); renderMainContent(); buildFilters();
  toast('Agreed price recorded','success');
}

// ── DELETE ────────────────────────────────────────────────────────────────────
async function deleteDev(devId){
  if(!confirm('Delete this development? This cannot be undone.')) return;
  await api('DELETE','/developments/'+devId);
  G.devs=G.devs.filter(function(d){return d.id!==devId;}); delete G.devComments[devId];
  closeDetail(); renderMainContent(); buildFilters();
  toast('Development deleted');
}

// ── SEND TO TENDER ────────────────────────────────────────────────────────────
async function sendDevToTender(devId){
  var d=G.devs.find(function(x){return x.id===devId;}); if(!d) return;
  var days=prompt('Bid deadline (days from now):','14'); if(!days) return;
  days=parseInt(days); if(isNaN(days)||days<1) return;
  var deadlineDate=new Date(Date.now()+days*24*60*60*1000);
  var body=Object.assign({},d,{deadlineDate:deadlineDate.toISOString(),isTender:true,status:'open'});
  delete body.id;
  var r=await api('POST','/tenders',body);
  if(r&&r.tender){ G.tenders.unshift(Object.assign({},r.tender,{deadlineDate:new Date(r.tender.deadlineDate)})); toast('Sent to tender','success'); }
  else toast('Failed to send to tender','error');
  closeDetail();
}

// ── TENDERS TAB ───────────────────────────────────────────────────────────────
function renderTenders(mc){
  var tenders=G.tenders; var u=G.user;
  if(tenders.length===0){mc.innerHTML='<div class="range-board"><div class="empty-state"><div class="empty-state-icon">&#128196;</div><h3>No tenders</h3><p>Send a development to tender to get started.</p></div></div>'; return;}
  var html='<div class="tenders-grid">';
  tenders.forEach(function(t){
    var img=(t.files||[]).find(function(f){return f.isImage&&f.dataUrl;});
    var bids=G.bids.filter(function(b){return b.tenderId===t.id;});
    var now=new Date(); var diff=new Date(t.deadlineDate)-now;
    var daysLeft=Math.ceil(diff/(1000*60*60*24));
    html+='<div style="background:white;border:1px solid var(--line);border-radius:16px;padding:1.25rem;cursor:pointer;" onclick="viewTenderDetail(\''+t.id+'\')">';
    html+='<div style="display:flex;gap:1rem;align-items:flex-start;">';
    if(img) html+='<img src="'+img.dataUrl+'" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;">';
    else html+='<div style="width:90px;height:90px;border-radius:10px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;">&#127912;</div>';
    html+='<div style="flex:1;"><div style="font-weight:700;font-size:0.95rem;margin-bottom:0.25rem;">'+t.description+'</div>';
    html+='<div style="font-size:0.78rem;color:var(--ink3);">'+( t.brand||'')+' &bull; '+( t.category||'')+' &bull; <strong>'+( t.seasonCode||'')+'</strong></div>';
    html+='<div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">';
    html+='<span style="background:#eef2ff;color:#6366f1;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">&pound;'+parseFloat(t.priceTarget||0).toFixed(2)+'</span>';
    if(bids.length) html+='<span style="background:#dbeafe;color:#1e40af;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">'+bids.length+' bid'+( bids.length>1?'s':'')+'</span>';
    html+='<span style="background:'+(daysLeft>3?'#d1fae5':'#fee2e2')+';color:'+(daysLeft>3?'#065f46':'#991b1b')+';padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;">'+(daysLeft>0?daysLeft+'d left':'Expired')+'</span>';
    html+='</div></div></div></div>';
  });
  html+='</div>';
  mc.innerHTML=html;
}

function viewTenderDetail(tid){ /* Simplified for v2 */ toast('Tender detail coming in next update'); }

// ── SUPPLIER VIEW ─────────────────────────────────────────────────────────────
function renderSupplierMain(){
  $('filter-bar').classList.add('hidden');
  $('new-dev-btn').classList.add('hidden');
  $('topbar-nav').innerHTML='<button class="nav-btn active" onclick="renderSupplierMain()">Available Tenders</button>';
  var mc=$('main-content');
  var u=G.user; var cats=u.categories||[];
  var available=G.tenders.filter(function(t){
    var catMatch=cats.length===0||cats.indexOf(t.category)>=0;
    var myBid=G.bids.find(function(b){return b.tenderId===t.id&&b.supplierId===u.id;});
    return catMatch&&!myBid&&new Date(t.deadlineDate)>new Date();
  });
  if(available.length===0){mc.innerHTML='<div class="range-board"><div class="empty-state"><div class="empty-state-icon">&#128200;</div><h3>No available tenders</h3><p>New tenders matching your categories will appear here.</p></div></div>'; return;}
  var html='<div class="tenders-grid">';
  available.forEach(function(t){
    var img=(t.files||[]).find(function(f){return f.isImage&&f.dataUrl;});
    html+='<div style="background:white;border:1px solid var(--line);border-radius:16px;padding:1.25rem;">';
    if(img) html+='<img src="'+img.dataUrl+'" style="width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;margin-bottom:1rem;">';
    html+='<div style="font-weight:700;font-size:0.95rem;">'+t.description+'</div>';
    html+='<div style="font-size:0.78rem;color:var(--ink3);margin-bottom:0.75rem;">'+( t.brand||'')+' &bull; '+( t.category||'')+'</div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1rem;">';
    html+='<div style="background:var(--line2);border-radius:8px;padding:0.65rem;"><div style="font-size:0.65rem;color:var(--ink4);font-weight:700;text-transform:uppercase;">Target</div><div style="font-weight:800;color:#6366f1;">&pound;'+parseFloat(t.priceTarget||0).toFixed(2)+'</div></div>';
    html+='<div style="background:var(--line2);border-radius:8px;padding:0.65rem;"><div style="font-size:0.65rem;color:var(--ink4);font-weight:700;text-transform:uppercase;">Qty</div><div style="font-weight:800;">'+( (t.orderQty||0).toLocaleString())+'</div></div></div>';
    html+='<button class="btn btn-primary" style="width:100%;" onclick="supBid(\''+t.id+'\')">Submit Bid</button>';
    html+='</div>';
  });
  html+='</div>';
  mc.innerHTML=html;
}
async function supBid(tid){
  var price=parseFloat(prompt('Your FOB price (£):')); if(isNaN(price)||price<=0) return;
  var lead=parseInt(prompt('Lead time (weeks):')); if(isNaN(lead)||lead<1) return;
  var r=await api('POST','/bids',{tenderId:tid,price:price,leadTime:lead*7,status:'submitted'});
  if(r){toast('Bid submitted!','success'); renderSupplierMain();}
  else toast('Failed to submit bid','error');
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
async function renderAdmin(mc){
  var r=await api('GET','/admin/users');
  var users=r?r.users:[];
  var pending=users.filter(function(u){return u.status==='pending';});
  var all=users;
  mc.innerHTML='<div class="admin-wrap"><h2 class="admin-section-title">Pending Approval ('+(pending.length)+')</h2>'+
    pending.map(function(u){ return userRow(u,true); }).join('')+
    '<h2 class="admin-section-title" style="margin-top:2rem;">All Users ('+(all.length)+')</h2>'+
    all.map(function(u){ return userRow(u,false); }).join('')+'</div>';
}
function userRow(u, showActions){
  return '<div class="user-row"><div><div class="user-row-name">'+u.name+'</div><div class="user-row-meta">'+u.type+(u.company?' &bull; '+u.company:'')+'</div></div><span class="user-row-status status-'+u.status+'">'+u.status+'</span>'+(showActions?'<button class="btn btn-green btn-sm" onclick="adminApprove(\''+u.id+'\')">Approve</button><button class="btn btn-danger btn-sm" onclick="adminReject(\''+u.id+'\')">Reject</button>':'')+'</div>';
}
async function adminApprove(uid){ await api('POST','/admin/approve/'+uid); toast('User approved','success'); renderAdmin($('main-content')); }
async function adminReject(uid){ await api('POST','/admin/reject/'+uid); toast('User rejected'); renderAdmin($('main-content')); }
</script>
